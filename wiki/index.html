<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>知识图谱 Wiki · shiwo233</title>
<style>
:root{--bg:#0a0e15;--card:#141c2b;--line:#22304a;--txt:#e8edf5;--sub:#8fa0b8;--acc:#5b8cff;--acc2:#f0b45b;--grad:linear-gradient(120deg,#5b8cff,#9d6bff 55%,#f0b45b)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;line-height:1.75}
header{padding:56px 22px 30px;text-align:center;position:relative;overflow:hidden}
header::before{content:"";position:absolute;width:60vw;height:60vw;max-width:500px;max-height:500px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.2),transparent 65%);top:-30%;left:-10%}
.kicker{font-size:12px;letter-spacing:.4em;color:var(--acc);position:relative}
h1{font-size:clamp(26px,7vw,40px);font-weight:900;margin-top:10px;position:relative}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--sub);font-size:14px;margin-top:10px;position:relative}
.layout{max-width:1080px;margin:0 auto;padding:20px;display:grid;gap:26px}
@media(min-width:860px){.layout{grid-template-columns:1fr 330px;align-items:start}}
h2{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:20px;background:var(--grad);border-radius:2px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;transition:.3s;display:block;text-decoration:none;color:inherit}
.topic:hover{border-color:var(--acc);transform:translateY(-2px)}
.topic h3{font-size:16.5px;margin-bottom:6px}
.topic p{color:var(--sub);font-size:13.5px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.tag.hot{border-color:var(--acc2);color:var(--acc2)}
.meta{font-size:12px;color:var(--sub);margin-top:10px}
.meta b{color:var(--acc)}
.feed{position:sticky;top:20px}
.u-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-height:70vh;overflow-y:auto}
.u-item{border-left:2px solid var(--acc);padding:4px 0 4px 12px;margin-bottom:16px}
.u-item:last-child{margin-bottom:0}
.u-date{font-size:11.5px;color:var(--acc2);font-weight:700}
.u-item h4{font-size:13.5px;margin:3px 0}
.u-item p{font-size:12.5px;color:var(--sub)}
.u-new{display:inline-block;font-size:10px;background:var(--grad);color:#0a0e15;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 0}
footer{text-align:center;color:var(--sub);font-size:12px;padding:30px 20px 50px;border-top:1px solid var(--line);margin-top:20px}
#lastSeen{font-size:11.5px;color:var(--sub);text-align:center;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <div class="kicker">KNOWLEDGE WIKI</div>
  <h1>研究议题<em>知识图谱</em></h1>
  <p class="sub">所有研究报告的永久索引 · 自动追踪议题更新</p>
</header>
<div class="layout">
  <main>
    <h2>议题库</h2>
    <div id="topics"></div>
  </main>
  <aside class="feed">
    <h2>更新动态</h2>
    <div id="lastSeen"></div>
    <div class="u-card" id="updates"><div class="empty">加载中…</div></div>
  </aside>
</div>
<footer>由 Kimi 自动化维护 · 数据文件：wiki/updates.json · 规范：AGENTS.md</footer>
<script>
// 议题索引（新报告上线时由自动化任务追加）
const topics=[
 {title:'中国大模型六小虎深度研究',desc:'智谱 / 月之暗面 / MiniMax / 百川 / 阶跃星辰 / 零一万物：格局、发家史、江湖八卦、能力横评与 2026–2028 推演',url:'../six-tigers-report/',tags:['AI','大模型','公司研究'],hot:true,date:'2026-07-24',watch:'六小虎模型发布、榜单名次、融资上市动态'}
];
document.getElementById('topics').innerHTML=topics.map(t=>`
 <a class="topic" href="${t.url}">
   <h3>${t.title}</h3><p>${t.desc}</p>
   <div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}${t.hot?'<span class="tag hot">追踪中</span>':''}</div>
   <div class="meta">上线 <b>${t.date}</b> · 监测项：${t.watch}</div>
 </a>`).join('');

// 更新动态：fetch updates.json，失败则用内嵌兜底
const fallback={updates:[{date:'2026-07-24',title:'知识图谱 Wiki 上线',topic:'系统',body:'首个议题《中国大模型六小虎深度研究》入库，更新追踪机制启动。'}]};
const NEW_DAYS=7;
function render(list){
  const seen=localStorage.getItem('wiki_seen')||'';
  const now=Date.now();
  document.getElementById('updates').innerHTML=list.map(u=>{
    const isNew=(now-new Date(u.date).getTime())<NEW_DAYS*864e5 && u.date>seen;
    return `<div class="u-item"><div class="u-date">${u.date}</div><h4>${u.title}${isNew?'<span class="u-new">NEW</span>':''}</h4><p>[${u.topic}] ${u.body}</p></div>`;
  }).join('')||'<div class="empty">暂无更新</div>';
  localStorage.setItem('wiki_seen',list[0]?list[0].date:'');
  document.getElementById('lastSeen').textContent='上次访问已记录，新更新将标注 NEW';
}
fetch('updates.json').then(r=>r.json()).then(d=>render(d.updates)).catch(()=>render(fallback.updates));
</script>
</body>
</html>
