<style>
:root{
  --r:16px;
  --grad:linear-gradient(120deg,#5b8cff,#9d6bff 55%,#f0b45b);
}
[data-theme="dark"]{
  --bg:#0a0e15;--bg2:#0d1220;--card:#141c2b;--card2:#182238;--line:#22304a;
  --txt:#e8edf5;--sub:#8fa0b8;--acc:#5b8cff;--acc2:#f0b45b;
  --nav:rgba(10,14,21,.8);--shadow:0 18px 50px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f6f7fb;--bg2:#eef0f6;--card:#ffffff;--card2:#f2f4fa;--line:#dde3ee;
  --txt:#1a2332;--sub:#5b6b84;--acc:#3b6fe0;--acc2:#c98a2d;
  --nav:rgba(246,247,251,.82);--shadow:0 18px 50px rgba(30,50,90,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;line-height:1.75;transition:background .4s,color .4s}
::selection{background:var(--acc);color:#fff}
a{color:inherit;text-decoration:none}

/* ===== nav ===== */
nav{position:sticky;top:0;z-index:100;background:var(--nav);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.nav-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:0 18px;height:60px}
.nav-spacer{flex:1;min-width:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-right:auto;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900}
.logo .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--sub);transition:.25s;white-space:nowrap}
.nav-links a:hover,.nav-links a.on{color:var(--txt);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ctl{display:flex;align-items:center;gap:8px;margin-left:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.25s}
.icon-btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.lang-btn{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:12.5px;font-weight:700;transition:.25s;letter-spacing:.03em}
.lang-btn:hover{border-color:var(--acc)}
@media(max-width:640px){.nav-links{display:none}}
/* docked category chips inside navbar */
#navCats{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 4px;min-width:0;flex-shrink:1}
#navCats::-webkit-scrollbar{display:none}
#navCats.dock{display:flex;animation:catsIn .3s ease}
@keyframes catsIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.nchip{flex-shrink:0;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nchip .dot{width:6px;height:6px;border-radius:50%}
.nchip.on{background:var(--grad);color:#fff;font-weight:700;border-color:transparent}
.nchip.on .dot{background:#fff!important}

/* ===== hero ===== */
header{position:relative;overflow:hidden;padding:72px 22px 44px;text-align:center}
.glow{position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none}
.g1{width:480px;height:480px;top:-220px;left:-120px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 22%,transparent),transparent 65%)}
.g2{width:420px;height:420px;bottom:-200px;right:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 16%,transparent),transparent 65%)}
.kicker{font-size:12px;letter-spacing:.42em;color:var(--acc);text-transform:uppercase;position:relative}
h1{font-size:clamp(28px,7vw,46px);font-weight:900;margin-top:12px;position:relative;letter-spacing:-.01em}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--sub);font-size:15px;margin-top:12px;position:relative}
.hstats{display:flex;gap:26px;justify-content:center;margin-top:26px;position:relative;flex-wrap:wrap}
.hstat{text-align:center}
.hstat b{display:block;font-size:24px;font-weight:800}
.hstat span{font-size:12px;color:var(--sub)}

/* ===== layout ===== */
.wrap{max-width:1160px;margin:0 auto;padding:10px 20px 40px;display:grid;gap:30px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 320px;align-items:start}}

/* category tabs */
.cats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.cat{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13.5px;cursor:pointer;transition:.28s;user-select:none;display:flex;align-items:center;gap:7px}
.cat .dot{width:7px;height:7px;border-radius:50%}
.cat.on{background:var(--grad);color:#fff;font-weight:700;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.cat.on .dot{background:#fff!important}

/* section block */
.blk{margin-bottom:30px}
.blk-head{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px}
.blk-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.blk-head h2::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--c,var(--acc))}
.blk-head span{font-size:12.5px;color:var(--sub)}
.blk.empty{display:none}

/* topic grid + cards */
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .3s,border-color .3s,box-shadow .3s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:var(--c,var(--acc));box-shadow:var(--shadow)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;background:var(--c,var(--acc));flex-shrink:0}
.card h3{font-size:16px;line-height:1.4;flex:1}
.card p{color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.tag.hot{border-color:var(--acc2);color:var(--acc2)}
.tag.demo{border-style:dashed;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--card);border:1px solid var(--acc);color:var(--txt);font-size:13.5px;padding:11px 22px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.card.demo{opacity:.82}
.card.demo .card-ico{filter:grayscale(.35)}
.card .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

/* ===== hover preview ===== */
#preview{position:fixed;z-index:200;width:340px;background:var(--card);border:1px solid var(--c,var(--acc));border-radius:18px;box-shadow:var(--shadow);padding:0;opacity:0;pointer-events:none;transform:translateY(8px) scale(.97);transition:opacity .22s,transform .22s;overflow:hidden}
#preview.show{opacity:1;transform:none}
.pv-banner{height:74px;background:var(--grad);position:relative;overflow:hidden}
.pv-banner::after{content:attr(data-icon);position:absolute;right:14px;bottom:-12px;font-size:52px;opacity:.35}
.pv-body{padding:14px 18px 16px}
.pv-body h4{font-size:15.5px;margin-bottom:8px}
.pv-body p{font-size:12.5px;color:var(--sub);line-height:1.7}
.pv-toc-label{font-size:10.5px;letter-spacing:.25em;color:var(--acc);font-weight:700;margin-bottom:6px}
.pv-toc{list-style:none;max-height:172px;overflow:hidden;margin-bottom:10px}
.pv-toc li{font-size:12.5px;color:var(--sub);padding:3px 0 3px 26px;position:relative;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.pv-toc li:last-child{border-bottom:none}
.pv-toc li::before{content:attr(data-n);position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent);color:var(--c,var(--acc));font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pv-meta{margin-top:12px;font-size:11.5px;color:var(--sub);display:grid;gap:4px}
.pv-meta b{color:var(--txt)}
.pv-open{margin-top:12px;display:inline-block;font-size:12px;font-weight:700;color:var(--acc)}
@media(hover:none){#preview{display:none}}

/* ===== updates feed ===== */
.side{position:sticky;top:80px}
.side h2{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.side h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--grad)}
.u-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-height:66vh;overflow-y:auto}
.u-card::-webkit-scrollbar{width:5px}.u-card::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.u-item{border-left:2px solid var(--acc);padding:4px 0 4px 12px;margin-bottom:15px}
.u-item:last-child{margin-bottom:0}
.u-date{font-size:11px;color:var(--acc2);font-weight:700}
.u-item h4{font-size:13px;margin:2px 0}
.u-item p{font-size:12px;color:var(--sub)}
.u-new{display:inline-block;font-size:9.5px;background:var(--grad);color:#fff;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
#seen{font-size:11px;color:var(--sub);text-align:center;margin-bottom:10px}

footer{border-top:1px solid var(--line);padding:30px 20px 56px;text-align:center;color:var(--sub);font-size:12px;margin-top:10px}
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
/* navbar shadow on scroll */
nav{transition:box-shadow .35s,border-color .35s}
nav.scrolled{box-shadow:0 8px 30px rgba(0,0,0,.18);border-color:transparent}
/* animated gradient text */
.logo .grad,h1 em{background-size:220% 220%;animation:gradShift 7s ease infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
/* 3D tilt cards */
.card{transform-style:preserve-3d;will-change:transform}
.card .card-ico{transition:transform .3s}
.card:hover .card-ico{transform:translateZ(24px) scale(1.06)}
/* glow follows mouse on hero */
.glow{transition:transform .5s cubic-bezier(.22,1,.36,1)}
/* category tabs entrance */
.cat{animation:popIn .5s cubic-bezier(.22,1,.36,1) backwards}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
/* feed item slide */
.u-item{animation:slideL .5s ease backwards}
@keyframes slideL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* preview toc item stagger */
.pv-toc li{animation:tocIn .3s ease backwards}
@keyframes tocIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
/* custom scrollbar */
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
</style>
</head>

/* ================= i18n ================= */
const I18N={
 zh:{navLib:'议题库',navUpd:'更新动态',navLatest:'最新报告',kicker:'PERSONAL KNOWLEDGE GRAPH',title1:'研究议题',title2:'知识图谱',sub:'所有研究报告的永久索引 · 自动追踪更新 · 分类归档',sTopics:'收录议题',sCats:'分类板块',sUpd:'累计动态',updTitle:'更新动态',all:'全部',pvWatch:'监测项',pvDate:'上线日期',pvOpen:'点击卡片打开报告 →',foot:'由 Kimi 自动化维护 · 数据：wiki/updates.json · 规范：AGENTS.md',tracking:'追踪中',online:'上线',empty:'该板块暂无内容，敬请期待',seen:'新动态将标注 NEW',demoTag:'示例',toastMsg:'这是示例占位内容，正式报告上线后将自动替换'},
 en:{navLib:'Library',navUpd:'Updates',navLatest:'Latest Report',kicker:'PERSONAL KNOWLEDGE GRAPH',title1:'Research',title2:'Knowledge Graph',sub:'Permanent index of all reports · Auto-tracked updates · Categorized',sTopics:'Topics',sCats:'Categories',sUpd:'Updates',updTitle:'Recent Updates',all:'All',pvWatch:'Watching',pvDate:'Published',pvOpen:'Click card to open →',foot:'Maintained by Kimi automation · Data: wiki/updates.json · Spec: AGENTS.md',tracking:'Tracking',online:'Published',empty:'Nothing here yet — stay tuned',seen:'New entries marked NEW',demoTag:'Demo',toastMsg:'Demo placeholder — will be replaced when the real report ships'}
};
let lang=localStorage.getItem('wiki_lang')||'zh';
function T(k){return I18N[lang][k]||k}

/* ================= theme ================= */
let theme=localStorage.getItem('wiki_theme')||'dark';
function applyTheme(){document.documentElement.dataset.theme=theme;document.getElementById('themeBtn').textContent=theme==='dark'?'☾':'☀'}
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('wiki_theme',theme);applyTheme()};

/* ================= lang ================= */
document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('wiki_lang',lang);renderAll()};
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中文';document.documentElement.lang=lang==='zh'?'zh-CN':'en'}

/* ================= library ================= */
let activeCat='all';
function pickCat(id,scroll){activeCat=id;renderCats();renderBlocks();if(scroll)document.getElementById('library').scrollIntoView({behavior:'smooth'})}
function renderCats(){
  const mk=(cls)=>`<div class="${cls} ${activeCat==='all'?'on':''}" data-c="all"><span class="dot" style="background:var(--acc)"></span>${T('all')}</div>`+
   CATS.map(c=>`<div class="${cls} ${activeCat===c.id?'on':''}" data-c="${c.id}"><span class="dot" style="background:${c.color}"></span>${lang==='zh'?c.zh:c.en}</div>`).join('');
  const box=document.getElementById('cats');box.innerHTML=mk('cat');
  box.querySelectorAll('.cat').forEach(el=>el.onclick=()=>pickCat(el.dataset.c,false));
  const nb=document.getElementById('navCats');nb.innerHTML=mk('nchip');
  nb.querySelectorAll('.nchip').forEach(el=>el.onclick=()=>pickCat(el.dataset.c,true));
}
/* dock category chips into navbar once the tabs bar scrolls past */
addEventListener('scroll',()=>{
  const cats=document.getElementById('cats');
  document.getElementById('navCats').classList.toggle('dock',cats.getBoundingClientRect().bottom<64);
},{passive:true});
function renderBlocks(){
  const box=document.getElementById('blocks');
  box.innerHTML=CATS.filter(c=>activeCat==='all'||activeCat===c.id).map(c=>{
    const items=TOPICS.filter(t=>t.cat===c.id);
    const cards=items.map((t,i)=>{const L=t[lang];return `
     <div class="card rv ${t.demo?'demo':''}" style="--c:${c.color}" data-url="${t.url}" data-demo="${t.demo?1:0}" data-cat="${c.id}" data-idx="${TOPICS.indexOf(t)}">
       <div class="card-top"><div class="card-ico" style="background:${c.color}">${t.icon}</div><h3>${L.title}</h3></div>
       <p>${L.desc}</p>
       <div class="tags">${t.demo?`<span class="tag demo">${T('demoTag')}</span>`:''}${L.tags.map(x=>`<span class="tag">${x}</span>`).join('')}${t.hot?`<span class="tag hot">${T('tracking')}</span>`:''}</div>
       <div class="meta"><span>${T('online')} ${t.date}</span><span>${lang==='zh'?c.zh:c.en}</span></div>
     </div>`}).join('');
    return `<div class="blk ${items.length?'':'empty'}" style="--c:${c.color}">
      <div class="blk-head"><h2>${lang==='zh'?c.zh:c.en}</h2><span>${items.length?items.length+' '+(lang==='zh'?'篇':'items'):T('empty')}</span></div>
      <div class="grid">${cards}</div></div>`;
  }).join('');
  bindCards();
  document.querySelectorAll('.rv').forEach(el=>rio.observe(el));
}

/* ================= hover preview ================= */
const pv=document.getElementById('preview');
let pvTimer;
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function bindCards(){
  document.querySelectorAll('.card').forEach(card=>{
    card.onclick=()=>{if(card.dataset.demo==='1'){toast(T('toastMsg'))}else{location.href=card.dataset.url}};
    if(matchMedia('(hover:none)').matches)return;
    card.onmouseenter=e=>{
      clearTimeout(pvTimer);
      pvTimer=setTimeout(()=>{
        const t=TOPICS[+card.dataset.idx],L=t[lang],c=CATS.find(x=>x.id===t.cat);
        document.getElementById('pvTitle').textContent=L.title;
        document.getElementById('pvToc').innerHTML=(L.toc||[]).map((s,i)=>`<li data-n="${String(i+1).padStart(2,'0')}" style="animation-delay:${i*0.04}s">${s}</li>`).join('');
        document.getElementById('pvWatch').textContent=L.watch;
        document.getElementById('pvDate').textContent=t.date;
        const b=document.getElementById('pvBanner');b.dataset.icon=t.icon;b.style.background=`linear-gradient(120deg,${c.color},${c.color}cc)`;
        pv.style.setProperty('--c',c.color);
        pv.classList.add('show');movePv(e);
      },180);
    };
    card.onmousemove=movePv;
    card.onmouseleave=()=>{clearTimeout(pvTimer);pv.classList.remove('show')};
  });
}
function movePv(e){
  const w=340,h=430,m=14;
  let x=e.clientX+m,y=e.clientY+m;
  if(x+w>innerWidth-m)x=e.clientX-w-m;
  if(y+h>innerHeight-m)y=innerHeight-h-m;
  pv.style.left=x+'px';pv.style.top=y+'px';
}

/* ================= updates ================= */
const fallback={updates:[{date:'2026-07-24',title:'知识图谱 Wiki 上线',title_en:'Wiki launched',topic:'系统',body:'首个议题《中国大模型六小虎深度研究》入库，更新追踪机制启动。',body_en:'First topic "Six LLM Tigers" archived; update tracking activated.'}]};
function renderUpdates(list){
  const seen=localStorage.getItem('wiki_seen')||'',now=Date.now();
  document.getElementById('updates').innerHTML=list.map((u,i)=>{
    const isNew=(now-new Date(u.date).getTime())<7*864e5&&u.date>seen;
    const title=lang==='en'&&u.title_en?u.title_en:u.title, body=lang==='en'&&u.body_en?u.body_en:u.body;
    return `<div class="u-item" style="animation-delay:${i*0.08}s"><div class="u-date">${u.date}</div><h4>${title}${isNew?'<span class="u-new">NEW</span>':''}</h4><p>[${u.topic}] ${body}</p></div>`;
  }).join('');
  document.getElementById('seen').textContent=T('seen');
  rollNum(document.getElementById('stUpdates'),list.length);
}
function loadUpdates(){fetch('updates.json').then(r=>r.json()).then(d=>{renderUpdates(d.updates);localStorage.setItem('wiki_seen',d.updates[0]?d.updates[0].date:'')}).catch(()=>renderUpdates(fallback.updates))}

/* ================= reveal ================= */
const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target)}}),{threshold:.1});

/* ================= init ================= */
/* rolling number (跑马灯) */
function rollNum(el,target){
  const t0=performance.now(),dur=1300;
  (function tick(t){const p=Math.min((t-t0)/dur,1);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)})(t0);
}
function renderAll(){applyI18n();renderCats();renderBlocks();rollNum(document.getElementById('stTopics'),TOPICS.length);rollNum(document.getElementById('stCats'),CATS.length);loadUpdates()}

/* navbar shadow on scroll */
addEventListener('scroll',()=>{document.querySelector('nav').classList.toggle('scrolled',scrollY>10)},{passive:true});

/* hero glow mouse parallax */
if(matchMedia('(hover:hover)').matches){
  addEventListener('mousemove',e=>{
    const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
    document.querySelector('.g1').style.transform=`translate(${x*40}px,${y*30}px)`;
    document.querySelector('.g2').style.transform=`translate(${-x*30}px,${-y*24}px)`;
  },{passive:true});
}

/* 3D tilt on cards (delegated after render) */
function bindTilt(){
  if(matchMedia('(hover:none)').matches)return;
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=`translateY(-4px) perspective(800px) rotateY(${x*7}deg) rotateX(${-y*7}deg)`;
    });
    card.addEventListener('mouseleave',()=>{card.style.transform=''});
  });
}

/* stagger reveal delays + toc stagger */
function stagger(){
  document.querySelectorAll('.grid').forEach(g=>[...g.children].forEach((c,i)=>c.style.transitionDelay=(i*0.07)+'s'));
  document.querySelectorAll('.pv-toc li').forEach((li,i)=>li.style.animationDelay=(i*0.04)+'s');
}

const _bind=bindCards;bindCards=function(){_bind();bindTilt();stagger()};
applyTheme();renderAll();
</script>
