<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洲明品牌部汇报 · 版本对照浏览</title>
<style>
:root{--bg:#F4F0E6;--ink:#16283C;--sub:#5D6874;--acc:#C0652B;--faint:#98A0AA;--line:#D8D1BF;--card:#FBF8F0;--green:#3F7A5E;--yel:#B98A1E;--red:#A34848;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"MiSans","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
#app{display:flex;min-height:100vh;}
aside{width:250px;flex:none;background:var(--ink);color:#C9D2DE;padding:28px 20px;position:sticky;top:0;height:100vh;overflow:auto;}
aside h1{font-size:15px;color:#fff;letter-spacing:2px;margin-bottom:4px;}
aside .sub{font-size:11px;color:#8A96A5;margin-bottom:20px;line-height:1.6;}
.vcard{border:1px solid #33445C;border-radius:8px;padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.vcard:hover{border-color:#D98A4E;}
.vcard.active{background:#22364E;border-color:#D98A4E;}
.vcard .vn{font-size:14px;font-weight:700;color:#fff;}
.vcard.active .vn{color:#D98A4E;}
.vcard .vp{font-size:10px;color:#8A96A5;margin:2px 0 4px;}
.vcard .vd{font-size:10.5px;color:#C9D2DE;line-height:1.55;}
main{flex:1;padding:26px 34px 60px;min-width:0;}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:8px 20px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:13px;cursor:pointer;color:var(--sub);}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.hint{font-size:11.5px;color:var(--faint);margin-bottom:16px;line-height:1.6;}
.sech{font-size:15px;font-weight:700;margin:22px 0 12px;color:var(--ink);font-family:"思源宋体","Songti SC",serif;}
.sech:first-child{margin-top:0;}
/* 浏览 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:.15s;}
.pcard:hover{border-color:var(--acc);transform:translateY(-2px);}
.pcard img{width:100%;display:block;}
.pcard .pt{padding:8px 10px;}
.pcard .pn{font-size:10px;color:var(--acc);font-weight:700;letter-spacing:1px;}
.pcard .tt{font-size:11.5px;color:var(--ink);line-height:1.45;margin-top:2px;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.b-new{background:#E4EFE8;color:var(--green);}.b-rework{background:#F6E3D2;color:var(--acc);}
.b-mod{background:#F0EAD6;color:var(--yel);}.b-same{background:#EDEAE0;color:var(--faint);}
.b-del{background:#F3DBDB;color:var(--red);}.b-none{background:#EDEAE0;color:#B9BFC9;}
/* 架构 */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.acard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.acard .an{font-size:13px;font-weight:700;color:var(--acc);}
.acard .ap{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:4px;}
.mx{border-collapse:collapse;background:var(--card);border:1px solid var(--line);width:100%;}
.mx th,.mx td{border:1px solid var(--line);padding:5px 4px;font-size:10.5px;text-align:center;}
.mx th{background:var(--ink);color:#fff;font-weight:400;writing-mode:vertical-rl;padding:8px 4px;max-height:120px;}
.mx td.rh{background:var(--ink);color:#fff;font-weight:700;font-size:11px;white-space:nowrap;padding:5px 10px;}
.mc{display:inline-block;min-width:34px;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:700;}
.c-new{background:#E4EFE8;color:var(--green);}.c-rework{background:#F6E3D2;color:var(--acc);}
.c-mod{background:#F0EAD6;color:var(--yel);}.c-same{background:#F1EEE6;color:var(--faint);}
.c-del{background:#F3DBDB;color:var(--red);}.c-none{color:#D8D1BF;}
.legend{font-size:11px;color:var(--sub);margin:10px 0;}
.legend span{margin-right:14px;}
/* 风格 */
.strow{display:grid;grid-template-columns:120px 1fr 300px;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.strow .sn{font-size:17px;font-weight:700;color:var(--ink);font-family:"思源宋体","Songti SC",serif;}
.strow .sn small{display:block;font-size:10px;color:var(--faint);font-family:"MiSans",sans-serif;margin-top:2px;}
.strow .sd{font-size:12px;color:var(--sub);line-height:1.7;}
.strow img{width:100%;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;}
/* 单页历史 */
.hist{display:grid;grid-template-columns:210px 1fr;gap:20px;}
.hlist .hitem{padding:9px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--sub);margin-bottom:4px;border:1px solid transparent;}
.hlist .hitem:hover{background:var(--card);}
.hlist .hitem.active{background:var(--card);border-color:var(--acc);color:var(--ink);font-weight:700;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);}
.tlitem{position:relative;display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.tlitem:before{content:'';position:absolute;left:-20px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);}
.tlitem img{width:100%;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;display:block;}
.tlitem .tv{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.tlitem .td{font-size:12px;color:var(--sub);line-height:1.65;margin-top:4px;}
.tlitem .tn{font-size:10px;color:var(--faint);margin-top:4px;}
/* 拼版器 */
.scheme{background:var(--ink);color:#C9D2DE;border-radius:10px;padding:14px 18px;margin-bottom:16px;font-size:12.5px;line-height:1.8;}
.scheme b{color:#D98A4E;}
.scheme .copybtn{margin-left:12px;background:#D98A4E;color:#16283C;border:none;border-radius:6px;padding:4px 14px;font-size:11.5px;font-weight:700;cursor:pointer;}
.pk-row{display:grid;grid-template-columns:170px 1fr 210px;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);}
.pk-row .lt{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.5;}
.pk-row .lt small{display:block;font-weight:400;color:var(--faint);font-size:10px;}
.vbtns{display:flex;gap:6px;flex-wrap:wrap;}
.vbtn{padding:4px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:11px;cursor:pointer;color:var(--sub);}
.vbtn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.vbtn.dis{opacity:.35;cursor:not-allowed;text-decoration:line-through;}
.pk-thumb img{width:100%;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;display:block;background:#fff;}
#lb{position:fixed;inset:0;background:rgba(22,40,60,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out;}
#lb img{max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 12px 60px rgba(0,0,0,.5);}
#lb .capw{position:absolute;bottom:18px;color:#C9D2DE;font-size:13px;}
@media(max-width:900px){aside{display:none;}.strow,.tlitem,.pk-row,.hist{grid-template-columns:1fr;}}

/* PPT浏览 */
.pptwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start;}
.pptwrap>div{min-width:0;}
.stagewrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
.stage{width:100%;display:block;border-radius:8px;cursor:zoom-in;}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:70px;border:none;border-radius:8px;background:rgba(22,40,60,.55);color:#fff;font-size:28px;cursor:pointer;line-height:1;}
.navbtn:hover{background:rgba(192,101,43,.85);} .navbtn:disabled{opacity:.25;cursor:default;}
.navbtn.prev{left:20px;} .navbtn.next{right:20px;}
.pmeta{display:flex;justify-content:space-between;gap:14px;margin:10px 2px;font-size:13px;color:var(--sub);}
.pmeta b{color:var(--ink);}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;}
.strip img{height:66px;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:none;opacity:.75;}
.strip img:hover{opacity:1;} .strip img.on{border-color:var(--acc);opacity:1;}
.pv{position:sticky;top:18px;max-height:calc(100vh - 60px);overflow-y:auto;padding-right:4px;}
.pvh{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.pvc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
.pvc img{width:100%;border-radius:6px;cursor:zoom-in;display:block;}
.pvt{font-size:12.5px;font-weight:700;color:var(--ink);margin:8px 0 4px;}
.pvd{font-size:12px;color:var(--sub);line-height:1.6;} .pvn{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:3px;}
.pvnone{font-size:11px;color:var(--faint);padding:14px 0;text-align:center;}

/* 协作流程 */
.cb-sec{font-size:15px;font-weight:700;color:var(--ink);margin:22px 0 12px;}
.cb-ways{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cb-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.cb-t{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:8px;}
.cb-d{font-size:12.5px;color:var(--sub);line-height:1.8;}
.cb-flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;}
.cb-node{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 12px;}
.cb-node b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:5px;}
.cb-node span{font-size:11px;color:var(--sub);line-height:1.6;}
.cb-node.tst{border-color:#C9A869;background:#FBF6E9;} .cb-node.rev{border-color:var(--acc);} .cb-node.apv{border-color:var(--good,#3F7A5E);} .cb-node.prd{background:var(--ink);} .cb-node.prd b{color:#EAD9AE;} .cb-node.prd span{color:#8A96A5;}
.cb-arr{align-self:center;color:var(--faint);font-size:16px;}
.cb-rules{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:12.5px;color:var(--sub);line-height:1.9;}
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>版本对照浏览</h1>
  <div class="sub">洲明品牌部 2026.8—10<br>阶段性成果汇报 · 原版→V19</div>
  <div id="vlist"></div>
</aside>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="sec-ppt"></div>
  <div id="sec-arch"></div>
  <div id="sec-style" style="display:none"></div>
  <div id="sec-pick" style="display:none"></div>
  <div id="sec-browse" style="display:none"></div>
  <div id="sec-collab" style="display:none"></div>
</main>
</div>
<div id="lb" onclick="this.style.display='none'"><img id="lb-img"><div class="capw" id="lb-cap"></div></div>

  document.getElementById('sec-ppt').innerHTML=
    `<div class="hint">正在浏览最新版 <b>${lm.name}</b>（共 ${total} 页），横排逐页翻阅；右侧为该页在各历史版本中的样子与修改说明。</div>
     <div class="pptwrap"><div>${main}</div><div class="pv"><div class="pvh">历史版本对照</div>${pv}</div></div>`;
  const on=document.querySelector('.strip img.on'); if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
/* ── 拼版器 ── */
const PK_ROWS=ORDER.map(k=>LP[k]).filter(Boolean)
  .concat([{key:'bodyALL',title:'正文 20 页（PART 01—03 · 复盘与展望）',map:null}]);
let SEL={};
function defSel(lp){const a=avail(lp);return a.includes('v8')?'v8':(a.length?a[a.length-1]:null);}
function initPick(){for(const lp of PK_ROWS)SEL[lp.key]=lp.map?defSel(lp):'v8';renderPick();}
function renderPick(){
  let h='';
  for(const lp of PK_ROWS){
    const av=lp.map?avail(lp):VERS; const sel=SEL[lp.key];
    const btns=VERS.map(v=>{const ok=av.includes(v);
      return `<button class="vbtn ${ok?'':'dis'} ${v==sel?'on':''}" ${ok?`onclick="setSel('${lp.key}','${v}')"`:''}>${DATA.meta[v].name}</button>`;}).join('');
    let thumb='';
    if(lp.map&&sel&&lp.map[sel]){const p=lp.map[sel][0];
      thumb=`<img loading="lazy" src="${img(sel,p)}" onclick="zoom('${imgHD(sel,p)}','${DATA.meta[sel].name} · 第 ${p} 页')">`;}
    else if(!lp.map){const p=sel=='orig'?5:sel=='v1'?11:sel=='v2'?9:(sel=='v5'||sel=='v6')?11:10;
      thumb=`<img loading="lazy" src="${img(sel,p)}">`;}
    h+=`<div class="pk-row"><div class="lt">${lp.title}<small>${av.map(v=>DATA.meta[v].name).join(' / ')}</small></div>
      <div class="vbtns">${btns}</div><div class="pk-thumb">${thumb}</div></div>`;}
  document.getElementById('sec-pick').innerHTML=
    `<div class="hint">给每一个逻辑页选择「用哪一版」，右侧实时预览；选好后点「复制方案」发给我，我按方案出新版。</div>
     <div class="scheme"><b>当前拼版方案</b>（共 ${PK_ROWS.length} 组）：${PK_ROWS.map(lp=>`${SHORT[lp.key]}=${DATA.meta[SEL[lp.key]].name}`).join('｜')}<button class="copybtn" onclick="copyScheme()">复制方案</button></div>${h}`;
}
function setSel(k,v){SEL[k]=v;renderPick();}
function copyScheme(){
  const txt='拼版方案：'+PK_ROWS.map(lp=>`${SHORT[lp.key]}=${DATA.meta[SEL[lp.key]].name}`).join('，');
  navigator.clipboard.writeText(txt).then(()=>{alert('已复制，直接粘贴发给我即可');});
}
/* ── 版本浏览 ── */
function renderBrowse(){
  const m=DATA.meta[curV];
  const ts=DATA.titles[curV]; let h='';
  for(let i=1;i<=m.pages;i++){
    h+=`<div class="pcard" onclick="zoom('${imgHD(curV,i)}','${m.name} · 第 ${i} 页')">
      <img loading="lazy" src="${img(curV,i)}">
      <div class="pt"><div class="pn">PAGE ${String(i).padStart(2,'0')}</div><div class="tt">${ts[i-1]||''}</div></div></div>`;}
  document.getElementById('sec-browse').innerHTML=
    `<div class="selbar" style="display:flex;gap:14px;align-items:center;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px">
      <label style="font-size:12px;color:var(--sub)">选择版本 <select id="brw" onchange="curV=this.value;renderBrowse()">${VERS.map(v=>`<option value="${v}" ${v==curV?'selected':''}>${DATA.meta[v].name}（${DATA.meta[v].pages}页）</option>`).join('')}</select></label>
      <span class="hint" style="margin:0">${m.desc} 点击任意页面放大查看。</span></div>
     <div class="grid">${h}</div>`;
}

initSide();initTabs();renderPPT();renderArch();renderStyle();initPick();renderCollab();renderBrowse();showTab('ppt');
